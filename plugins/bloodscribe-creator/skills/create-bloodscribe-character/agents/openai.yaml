interface:
  display_name: "Create BloodScribe Character"
  short_description: "Create and validate BloodScribe characters"
  default_prompt: "Use $create-bloodscribe-character to turn my idea into a validated BloodScribe character."
dependencies:
  tools:
    - type: "mcp"
      value: "bloodscribe-creator"
      description: "BloodScribe Creator mechanic catalog, recipes, and deterministic character validation"
      transport: "streamable_http"
      url: "https://bloodscribe.app/mcp"
policy:
  allow_implicit_invocation: true
